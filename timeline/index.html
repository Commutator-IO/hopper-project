<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          addEventListener('error', function (e) {
            var el = e.target; var u = el && (el.src || el.href);
            if (u && /\/assets\//.test(u) && !sessionStorage.getItem('assetReload')) {
              sessionStorage.setItem('assetReload', '1'); location.reload();
            }
          }, true);
          addEventListener('load', function () { sessionStorage.removeItem('assetReload'); });
        } catch (_) {}
      })();
    </script>
    <title>Timeline | Hopper Ledgers</title>
    <meta name="description" content="Edward Hopper's life beside the ledgers' dated leaves — every entry sourced and linked." />

    <link rel="canonical" href="https://hopper.commutator.io/timeline/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
