name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The Lean certificates (lean.yml): the accounts arithmetic and Book IV's
  # reader. The site is built only once they prove, so it never publishes a
  # figure the proofs reject.
  lean:
    uses: ./.github/workflows/lean.yml

  build:
    needs: lean
    runs-on: ubuntu-latest
    steps:
      # The whole history, not the tip: `scripts/manifest.mjs` and
      # `scripts/tei.mjs` read `git log` for each transcription, so that the
      # site can say when a reading was last corrected and the TEI can carry
      # its revisions. A shallow clone reports every file as changed once, on
      # the day of the last commit, and both are written to say nothing rather
      # than that.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Reads the repository's Pages configuration and reports where the site
      # will actually be served from: `/` when a custom domain is set,
      # `/hopper-project` when it is not. Deriving it beats hard-coding it,
      # because the two cases differ by one DNS record and the wrong one
      # produces a page that returns 200 with every asset 404.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # The prose and the code, before anything is built from either. oxlint
      # was in package.json and run by nobody; markdownlint-cli2 checks the
      # conventions CONTRIBUTING states, on the files this repository writes
      # (#5, and the work #13 was closed without landing).
      - run: npm run lint
      - run: npm run lint:md
      - run: npm run catalogue
      # The generated inventory is rebuilt rather than trusted: a catalogue.ts
      # that had drifted from harvest/ is caught here rather than by a reader
      # opening a sheet that is not there.
      - run: git diff --exit-code src/content/catalogue.ts
      - run: npm run render
      - run: npm run tei
      # Well-formed is not valid, and the export was invalid TEI for as long as
      # it existed — one `<div>` a batch with a `<head>` at every leaf inside
      # it, which parses and which TEI forbids. `xmllint --noout` had been
      # asking whether the bytes were XML. This asks the Consortium's own
      # RELAX NG, at a pinned version and a checked digest, and then asks
      # tei/hopper.odd whether the export stayed inside the subset it promises.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/tei
          key: tei-p5-schema-${{ hashFiles('scripts/tei-validate.mjs') }}
      - name: Validate the TEI
        run: |
          if ! command -v xmllint >/dev/null; then
            sudo apt-get update && sudo apt-get install -y libxml2-utils
          fi
          npm run tei:validate

      # The citation metadata is generated from the corpus census and rebuilt
      # here for the same reason `src/content/catalogue.ts` is: a CITATION.cff
      # that still says 499 sheets after the next batch lands is a number
      # somebody will quote. It is deterministic — the release date is the
      # latest `Pass:` line in the transcriptions, not the clock — so this
      # comparison means something.
      - run: npm run manifest
      - run: npm run citation
      - run: git diff --exit-code CITATION.cff codemeta.json .zenodo.json

      # The glossary is declared by hand and checked against the leaves: an
      # entry whose pattern matches nothing on a transcribed sheet fails, which
      # is what keeps the key from claiming forms nobody has read. The
      # comparison catches the other direction — a batch that lands, or a
      # reading that is corrected, moves the evidence under an entry.
      - run: npm run glossary
      - run: git diff --exit-code src/content/glossary.json

      # The framing register — what the black notebook says about frame
      # makers, finishes, papers and supports — is the same design applied to
      # a notebook, and is checked the same way.
      - run: npm run framing
      - run: git diff --exit-code src/content/framing.json
      - run: npm run spending
      - run: git diff --exit-code src/content/spent.json
      # The calendar of dated rows. It had drifted from the transcriptions
      # unnoticed — three rows and a day — because it was the one derived file
      # in src/content/ that nothing regenerated and compared here.
      - run: npm run streak
      # Its header carries the hour it was written, as every generated file
      # here does, so the comparison ignores that one line and holds the rest
      # to the transcriptions.
      - run: git diff --exit-code -I '"generated"' src/content/streak.json

      # Tectonic, pinned, for the transcript PDFs. A static musl binary from
      # the project's own releases rather than a piped install script or the
      # whole of TeX Live: 20 MB against 500, and a version somebody chose.
      - name: Install Tectonic
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /usr/local/bin tectonic
          tectonic --version
      # Tectonic fetches the TeX packages it needs on first use. Cached, or a
      # deploy spends a minute downloading longtable every time.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-${{ hashFiles('transcripts/preamble/*.sty') }}
          restore-keys: tectonic-bundle-
      # Fails on an overfull box, which in a transcription hides content.
      - run: npm run pdf
      # poppler for the rasterisation of the article's figures, ImageMagick to
      # trim the page margins off each.
      - name: Install poppler and ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick
      # The article the site serves from /method/: the PDF to read, and the
      # TEI the journal is sent, encoded against its own schema and validated
      # in both halves — RELAX NG with jing, Schematron with SchXslt on Saxon
      # — so that the file served is one the journal's validator accepts. Java
      # is on the runner already. Built here rather than committed, like the
      # TEI export of the corpus.
      - run: npm run article-tei

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
