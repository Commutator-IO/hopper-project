name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The generated data is rebuilt rather than trusted: a catalogue.ts that
      # had drifted from harvest/ would be caught here rather than by a reader
      # opening a sheet that is not there.
      - run: npm run catalogue
      - run: npm run books
      - run: git diff --exit-code src/content/catalogue.ts src/content/books.json
      - run: npm run render
      - run: npm run tei
      - run: npm run records
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
